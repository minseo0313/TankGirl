  <text class="note " x="1222" y="777" text-anchor="middle">GET /api/events, /api/status, /photos</text>
  <text class="note " x="1222" y="796" text-anchor="middle">조회 전용, 핫스팟 안, 화면 미반영</text>

  <!-- 설명 -->
  <text class="foot" x="24" y="912">IF-01 ~ IF-12 = 본문 경계 번호. 뼈대 = 함수는 있지만 관찰 → 조준 → 자극 → 재관찰 → 기록 흐름에는 아직 연결 안 됨</text>
  <text class="foot" x="24" y="938">yolo_raw/, runtime/, events/ 와 모델 파일은 git 에 넣지 않음. 지금 탐지는 사람과 멧돼지(클래스 0, 2)만 씀</text>
</svg>
