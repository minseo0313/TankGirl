<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="980" viewBox="0 0 1400 980" role="img" aria-labelledby="title desc" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="15" fill="#1D1D1F">
  <title id="title">수집, 학습, 주행 사이의 인터페이스 경계</title>
  <desc id="desc">Raspberry Pi 수집: 카메라에서 IF-01로 gi.py, gi.py는 모드 1 주행 사진(IF-02)과 모드 2 탐지 사진을 만든다. 주행 사진은 dl.py로 편집해 프로젝트 zip, 탐지 사진은 label.py로 라벨링해 yolo_dataset.zip. Colab 학습: train_all.ipynb 1부 주행 CNN, 2부 YOLO 학습, 3부에서 프로젝트_models.zip으로 묶고, train_detect.ipynb는 탐지만 학습한다. Raspberry Pi 주행: models.zip이 IF-03, IF-04로 ar.py에, 카메라가 IF-01로 ar.py에 들어간다. ar.py는 IF-05 yolo_detect.py, IF-06 power_check.py, IF-07 GPIO 부품, IF-08 aim.py, IF-09 stimulus.py, scenario.py, IF-10 event_log.py와 연결되고, event_log.py는 IF-11 event_server.py로 조회된다. 설정 창 settings_gui.py와 ar.py는 IF-12 runtime 파일로 설정, 명령, 상태, 시퀀스를 주고받는다.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#86868B"/>
    </marker>
    <style>
      .group { fill: #F5F5F7; }
      .group-title { font-size: 20px; font-weight: 600; }
      .box { fill: #FFFFFF; stroke: #D2D2D7; stroke-width: 1.5; }
      .main { fill: #0071E3; }
      .title { font-size: 15px; font-weight: 600; }
      .note { font-size: 13px; fill: #6E6E73; }
      .on-main { fill: #FFFFFF; }
      .line { fill: none; stroke: #86868B; stroke-width: 1.5; }
      .arrow { marker-end: url(#arrow); }
      .both { marker-start: url(#arrow); marker-end: url(#arrow); }
      .label { font-size: 13px; fill: #6E6E73; }
      .foot { font-size: 14px; fill: #6E6E73; }
    </style>
  </defs>
  <rect width="1400" height="980" fill="#FFFFFF"/>


  <!-- ===== 묶음 1: Raspberry Pi 수집 ===== -->
  <rect class="group" x="24" y="32" width="360" height="840" rx="12"/>
  <text class="group-title" x="48" y="70">Raspberry Pi: 수집</text>
  <!-- IF-01 카메라 (수집) -->
  <rect class="box" x="134" y="104" width="120" height="56" rx="12"/>
  <text class="title " x="194" y="127.5" text-anchor="middle">카메라</text>
  <text class="note " x="194" y="146.5" text-anchor="middle">OV5647, 640x480</text>
  <path class="line arrow" d="M 194 160 V 200"/>
  <text class="label" x="204" y="186" text-anchor="start">IF-01</text>
  <!-- gi.py -->
  <rect class="box" x="114" y="200" width="160" height="60" rx="12"/>
  <text class="title " x="194" y="225.5" text-anchor="middle">gi.py 수집</text>
  <text class="note " x="194" y="244.5" text-anchor="middle">시작할 때 모드 1, 2</text>
  <path class="line arrow" d="M 194 260 V 285 H 114 V 310"/>
  <path class="line arrow" d="M 194 285 H 294 V 310"/>
  <text class="label" x="106" y="280" text-anchor="end">IF-02</text>
  <!-- 주행 사진 -->
  <rect class="box" x="40" y="310" width="148" height="76" rx="12"/>
  <text class="title " x="114" y="334" text-anchor="middle">1 주행 사진</text>
  <text class="note " x="114" y="353" text-anchor="middle">&lt;프로젝트&gt;/</text>
  <text class="note " x="114" y="372" text-anchor="middle">P0001__+12.png</text>
  <!-- 탐지 사진 -->
  <rect class="box" x="220" y="310" width="148" height="76" rx="12"/>
  <text class="title " x="294" y="334" text-anchor="middle">2 탐지 사진</text>
  <text class="note " x="294" y="353" text-anchor="middle">yolo_raw/&lt;날짜&gt;/</text>
  <text class="note " x="294" y="372" text-anchor="middle">640x480 jpg</text>
  <path class="line arrow" d="M 114 386 V 430"/>
  <path class="line arrow" d="M 294 386 V 430"/>
  <!-- dl.py -->
  <rect class="box" x="40" y="430" width="148" height="76" rx="12"/>
  <text class="title " x="114" y="454" text-anchor="middle">dl.py 편집</text>
  <text class="note " x="114" y="473" text-anchor="middle">7구간 분류, 증강</text>
  <text class="note " x="114" y="492" text-anchor="middle">[Z] zip, [P] Pi 학습</text>
  <!-- label.py -->
  <rect class="box" x="220" y="430" width="148" height="76" rx="12"/>
  <text class="title " x="294" y="454" text-anchor="middle">label.py 라벨링</text>
  <text class="note " x="294" y="473" text-anchor="middle">0 person 1 roe_deer</text>
  <text class="note " x="294" y="492" text-anchor="middle">2 wild_boar</text>
  <path class="line arrow" d="M 114 506 V 550"/>
  <path class="line arrow" d="M 294 506 V 550"/>
  <text class="label" x="304" y="534" text-anchor="start">--zip</text>
  <!-- 프로젝트 zip -->
  <rect class="box" x="40" y="550" width="148" height="56" rx="12"/>
  <text class="title " x="114" y="573.5" text-anchor="middle">&lt;프로젝트&gt;.zip</text>
  <text class="note " x="114" y="592.5" text-anchor="middle">200x66 YUV 사진</text>
  <!-- yolo_dataset.zip -->
  <rect class="box" x="220" y="550" width="148" height="56" rx="12"/>
  <text class="title " x="294" y="573.5" text-anchor="middle">yolo_dataset.zip</text>
  <text class="note " x="294" y="592.5" text-anchor="middle">train, val, test 7:2:1</text>
  <text class="foot" x="44" y="800">수집과 주행은 카메라를 함께 못 씀</text>
  <text class="foot" x="44" y="824">(gi.py 를 끄고 ar.py 실행)</text>

  <!-- ===== 묶음 2: Colab 학습 ===== -->
  <rect class="group" x="404" y="32" width="320" height="840" rx="12"/>
  <text class="group-title" x="428" y="70">Colab: 학습 (GPU)</text>
  <text class="foot" x="428" y="104">학습 데이터는 zip 으로 올리고,</text>
  <text class="foot" x="428" y="126">결과도 zip 하나로 받음</text>
  <!-- train_detect.ipynb -->
  <rect class="box" x="424" y="430" width="280" height="76" rx="12"/>
  <text class="title " x="564" y="454" text-anchor="middle">train_detect.ipynb</text>
  <text class="note " x="564" y="473" text-anchor="middle">탐지만 학습</text>
  <text class="note " x="564" y="492" text-anchor="middle">→ detect_models.zip</text>
  <path class="line arrow" d="M 368 578 H 424"/>
