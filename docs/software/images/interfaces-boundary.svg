  <text class="title " x="514" y="573.5" text-anchor="middle">2부 YOLO 학습</text>
  <text class="note " x="514" y="592.5" text-anchor="middle">data.yaml, NCNN 변환</text>
  <path class="line arrow" d="M 114 606 V 690 H 424"/>
  <!-- 1부 주행 CNN -->
  <rect class="box" x="424" y="660" width="180" height="60" rx="12"/>
  <text class="title " x="514" y="685.5" text-anchor="middle">1부 주행 CNN</text>
  <text class="note " x="514" y="704.5" text-anchor="middle">aicarA.ipynb 와 같음</text>
  <path class="line arrow" d="M 604 578 H 664 V 760"/>
  <path class="line arrow" d="M 514 720 V 760"/>
  <!-- models zip -->
  <rect class="box" x="424" y="760" width="280" height="92" rx="12"/>
  <text class="title " x="564" y="782.5" text-anchor="middle">3부 &lt;프로젝트&gt;_models.zip</text>
  <text class="note " x="564" y="801.5" text-anchor="middle">_&lt;프로젝트&gt;_model_check.pt</text>
  <text class="note " x="564" y="820.5" text-anchor="middle">person_yolo26n_ncnn (416)</text>
  <text class="note " x="564" y="839.5" text-anchor="middle">animal_yolo26n_ncnn (640)</text>

  <!-- ===== 묶음 3: Raspberry Pi 주행 ===== -->
  <rect class="group" x="744" y="32" width="632" height="840" rx="12"/>
  <text class="group-title" x="768" y="70">Raspberry Pi: 주행</text>
  <path class="line arrow" d="M 704 806 H 734 V 460 H 764"/>
  <text class="label" x="0" y="0" text-anchor="middle" transform="translate(727 640) rotate(-90)">IF-03, IF-04 (aicar/ 에서 풂)</text>
  <!-- IF-01 카메라 (주행) -->
  <rect class="box" x="822" y="104" width="120" height="56" rx="12"/>
  <text class="title " x="882" y="127.5" text-anchor="middle">카메라</text>
  <text class="note " x="882" y="146.5" text-anchor="middle">640x480 BGR</text>
  <path class="line arrow" d="M 882 160 V 400"/>
  <text class="label" x="892" y="290" text-anchor="start">IF-01</text>
  <!-- ar.py -->
  <rect class="main" x="764" y="400" width="236" height="120" rx="12"/>
  <text class="title on-main" x="882" y="436.5" text-anchor="middle">ar.py 주행 프로그램</text>
  <text class="note on-main" x="882" y="455.5" text-anchor="middle">차선 → 조향각 → 모터</text>
  <text class="note on-main" x="882" y="474.5" text-anchor="middle">사람, 멧돼지, 장애물 → 정지</text>
  <text class="note on-main" x="882" y="493.5" text-anchor="middle">카메라 서보 천천히 왕복</text>
  <path class="line both" d="M 882 520 V 620"/>
  <text class="label" x="892" y="576" text-anchor="start">IF-12</text>
  <!-- runtime 파일 -->
  <rect class="box" x="764" y="620" width="236" height="96" rx="12"/>
  <text class="title " x="882" y="644.5" text-anchor="middle">runtime/ 파일</text>
  <text class="note " x="882" y="663.5" text-anchor="middle">settings.json 설정</text>
  <text class="note " x="882" y="682.5" text-anchor="middle">control.json 명령, status.json 상태</text>
  <text class="note " x="882" y="701.5" text-anchor="middle">sequences.json 시나리오 단계</text>
  <path class="line both" d="M 882 716 V 760"/>
  <!-- settings_gui.py -->
  <rect class="box" x="764" y="760" width="236" height="76" rx="12"/>
  <text class="title " x="882" y="784" text-anchor="middle">settings_gui.py 설정 창</text>
  <text class="note " x="882" y="803" text-anchor="middle">설정 저장, 실험 버튼</text>
  <text class="note " x="882" y="822" text-anchor="middle">시나리오 탭, 시퀀스 편집</text>
  <path class="line" d="M 1000 460 H 1030"/>
  <path class="line" d="M 1030 140 V 668"/>
  <path class="line arrow" d="M 1030 140 H 1080"/>
  <text class="label" x="1036" y="134" text-anchor="start">IF-05</text>
  <!-- IF-05 -->
  <rect class="box" x="1080" y="104" width="284" height="72" rx="12"/>
  <text class="title " x="1222" y="126" text-anchor="middle">yolo_detect.py 탐지</text>
  <text class="note " x="1222" y="145" text-anchor="middle">submit(화면) → state()</text>
  <text class="note " x="1222" y="164" text-anchor="middle">사람 416, 멧돼지 640, 스레드 1개</text>
  <path class="line arrow" d="M 1030 228 H 1080"/>
  <text class="label" x="1036" y="222" text-anchor="start">IF-06</text>
  <!-- IF-06 -->
  <rect class="box" x="1080" y="192" width="284" height="72" rx="12"/>
  <text class="title " x="1222" y="223.5" text-anchor="middle">power_check.py 전원</text>
  <text class="note " x="1222" y="242.5" text-anchor="middle">vcgencmd 전압 경고</text>
  <path class="line arrow" d="M 1030 316 H 1080"/>
  <text class="label" x="1036" y="310" text-anchor="start">IF-07</text>
  <!-- IF-07 -->
  <rect class="box" x="1080" y="280" width="284" height="72" rx="12"/>
  <text class="title " x="1222" y="302" text-anchor="middle">GPIO 부품</text>
  <text class="note " x="1222" y="321" text-anchor="middle">모터 12 13 5 6, 서보 17 27</text>
  <text class="note " x="1222" y="340" text-anchor="middle">부저 23, 램프, CdS, 거리센서 I²C</text>
  <path class="line arrow" d="M 1030 404 H 1080"/>
  <text class="label" x="1036" y="398" text-anchor="start">IF-08</text>
  <!-- IF-08 -->
  <rect class="box" x="1080" y="368" width="284" height="72" rx="12"/>
  <text class="title " x="1222" y="399.5" text-anchor="middle">aim.py 서보 조준 (뼈대)</text>
  <text class="note " x="1222" y="418.5" text-anchor="middle">박스 → 각도, AIM_AUTO 일 때</text>
  <path class="line arrow" d="M 1030 492 H 1080"/>
  <text class="label" x="1036" y="486" text-anchor="start">IF-09</text>
  <!-- IF-09 -->
  <rect class="box" x="1080" y="456" width="284" height="72" rx="12"/>
  <text class="title " x="1222" y="478" text-anchor="middle">stimulus.py 자극 (뼈대)</text>
  <text class="note " x="1222" y="497" text-anchor="middle">sound_a, sound_b, sound_led, led</text>
  <text class="note " x="1222" y="516" text-anchor="middle">sounds/*.wav, LED 핀</text>
  <path class="line arrow" d="M 1030 580 H 1080"/>
