  <rect class="box" x="1080" y="544" width="284" height="72" rx="12"/>
  <text class="title " x="1222" y="566" text-anchor="middle">scenario.py 시나리오</text>
  <text class="note " x="1222" y="585" text-anchor="middle">시퀀스를 순서대로 실행</text>
  <text class="note " x="1222" y="604" text-anchor="middle">탐지되면 자동 실행 (설정)</text>
  <path class="line arrow" d="M 1030 668 H 1080"/>
  <text class="label" x="1036" y="662" text-anchor="start">IF-10</text>
